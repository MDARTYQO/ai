name: Download and Split Qwen 3.5 9B Model

on:
  workflow_dispatch:  # הפעלה ידנית
  # או: push, schedule, וכו'

jobs:
  download-and-split-model:
    runs-on: ubuntu-latest

    steps:
      - name: Install Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama service
        run: |
          ollama serve &
          sleep 5

      - name: Download Qwen 3.5 9B model
        run: |
          ollama pull qwen3.5:9b

      - name: Find and split model blob
        run: |
          # מצא את ה-blob הגדול ביותר (המודל עצמו)
          BLOB_DIR="$HOME/.ollama/models/blobs"
          
          echo "Checking blob directory: $BLOB_DIR"
          ls -lah "$BLOB_DIR" || echo "Directory not found"
          
          # מצא את הקובץ הגדול ביותר בתיקייה
          LARGEST_BLOB=$(find "$BLOB_DIR" -type f -exec ls -lS {} + 2>/dev/null | head -1 | awk '{print $NF}')
          
          if [ -z "$LARGEST_BLOB" ]; then
            echo "Error: No blob files found"
            echo "Checking alternative locations:"
            find "$HOME/.ollama" -type f -name "sha256*" 2>/dev/null || echo "No sha256 files found"
            exit 1
          fi

          echo "Found model blob: $LARGEST_BLOB"
          BLOB_SIZE=$(stat -c%s "$LARGEST_BLOB")
          echo "Model size: $(($BLOB_SIZE / 1024 / 1024)) MB"

          # פצל לחלקים של 1.9GB (מתחת למגבלת 2GB)
          split -b 1900M "$LARGEST_BLOB" qwen3.5-9b-part-

          echo "Split complete. Parts created:"
          ls -lh qwen3.5-9b-part-*

      - name: Upload model parts as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qwen3.5-9b-model-parts
          path: qwen3.5-9b-part-*
          retention-days: 90
